name: Offline evaluation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_replay:
        description: Re-score all 730 retained allocations from the pinned Release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TOPOWORLD_DISABLE_VENDOR: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check synthetic examples
        run: python -B scripts/check_example.py
      - name: Download and verify the published package
        if: github.event_name == 'workflow_dispatch' && inputs.full_replay
        run: python -B scripts/download_release.py --output artifacts/reproducibility
      - name: Run frozen scoring and rebuild tables
        if: github.event_name == 'workflow_dispatch' && inputs.full_replay
        run: python -B scripts/reproduce.py --package artifacts/reproducibility --output runs/replay01 --tables runs/tables01
      - name: Record the Linux environment and source revision
        if: github.event_name == 'workflow_dispatch' && inputs.full_replay
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime, importlib.metadata, json, os, platform, sys
          def read(p): return json.loads(Path(p).read_text())
          run = read('runs/replay01/RUN_RECEIPT.json')
          comparison = read('runs/replay01/FROZEN_RESULT_COMPARISON.json')
          checks = {n: read('runs/tables01/' + n) == read('artifacts/reproducibility/example_tables/' + n)
                    for n in ['MAJOR_TABLES.json', 'PAIRED_BOOTSTRAP.json']}
          receipt = {'status': 'PASS' if comparison['matched'] == 730 and not comparison['mismatches'] and all(checks.values()) else 'FAIL',
                     'timestamp_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     'platform': platform.platform(), 'machine': platform.machine(), 'python': sys.version,
                     'dependencies': {n: importlib.metadata.version(n) for n in ['jsonschema', 'jsonschema-specifications', 'referencing', 'rpds-py', 'attrs']},
                     'source_commit': os.environ['SOURCE_COMMIT'], 'run_url': os.environ['RUN_URL'],
                     'release': read('docs/release.json'), 'replay_receipt': run,
                     'frozen_signature_comparison': {'compared': comparison['compared'], 'matched': comparison['matched'], 'mismatches': len(comparison['mismatches'])},
                     'principal_tables_equal_frozen': checks, 'new_model_calls': 0}
          Path('runs/Linux_validation.json').write_text(json.dumps(receipt, indent=2) + '\n')
          assert receipt['status'] == 'PASS'
          PY
      - name: Preserve small acceptance receipts
        if: always() && github.event_name == 'workflow_dispatch' && inputs.full_replay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-reproduction-receipts
          path: |
            runs/Linux_validation.json
            runs/replay01/RUN_RECEIPT.json
            runs/replay01/FROZEN_RESULT_COMPARISON.json
          if-no-files-found: warn
          retention-days: 30
